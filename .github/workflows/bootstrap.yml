name: Bootstrap platform folders (run once)

# Generates the android/ and web/ folders with `flutter create`, formats
# the code and commits the result. Safe to delete after it has run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android and web platform folders
        run: |
          flutter create . \
            --platforms=android,web \
            --org za.co.careerswitch \
            --project-name career_switch \
            --description "Helps people switch into tech."

      - name: Format Dart code
        run: dart format lib test

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: generate Android and web platform folders" || echo "Nothing to commit"
          git push
