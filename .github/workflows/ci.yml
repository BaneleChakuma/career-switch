name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android (debug APK)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check android/ exists
        id: platform
        run: echo "ready=$([ -d android ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.platform.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        if: steps.platform.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        if: steps.platform.outputs.ready == 'true'

      - name: Build debug APK
        if: steps.platform.outputs.ready == 'true'
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        if: steps.platform.outputs.ready == 'true'
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-web:
    name: Build web
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check web/ exists
        id: platform
        run: echo "ready=$([ -d web ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        if: steps.platform.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        if: steps.platform.outputs.ready == 'true'

      - name: Build web release
        if: steps.platform.outputs.ready == 'true'
        run: flutter build web --release
